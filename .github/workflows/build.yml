name: Build ShredPack EXE

on:
  push:
    branches:
      - main  # Automatically builds every time you push code changes to the main branch

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller tkinterdnd2 send2trash

    - name: Compile Script to Standalone EXE
      run: |
        pyinstaller --noconsole --onefile --collect-all tkinterdnd2 --name="ShredPack" shredpack.py

    - name: Create or Update Rolling Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "ShredPack Automatic Build"
        body: "Automated compilation of the latest commit on the main branch."
        prerelease: true
        files: dist/ShredPack.exe
