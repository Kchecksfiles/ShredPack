name: Build ShredPack EXE
on:
  push:
    tags:
      - 'v*'  # Triggers a build every time you release a new version tag (like v1.0)

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller tkinterdnd2 send2trash

    - name: Compile Script to Standalone EXE
      run: |
        pyinstaller --noconsole --onefile --collect-all tkinterdnd2 --name="ShredPack" shredpack.py

    - name: Create Automatic Release Artifact
      uses: softprops/action-gh-release@v2
      with:
        files: dist/ShredPack.exe
