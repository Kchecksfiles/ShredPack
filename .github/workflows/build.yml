name: Build ShredPack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install py7zr pycdlib pyzipper tkinterdnd2 send2trash pyinstaller

      - name: Build ShredPack.exe
        run: pyinstaller --noconsole --onefile --icon=shredpack.ico --add-data "shredpack.ico;." --collect-all py7zr --collect-all pycdlib --collect-all pyzipper --collect-all tkinterdnd2 --name ShredPack shredpack.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Verify build files
        run: |
          Write-Host "Checking dist folder:"
          Get-ChildItem -Recurse dist

          Write-Host "Checking Output folder:"
          Get-ChildItem -Recurse Output

          if (!(Test-Path "dist\ShredPack.exe")) {
            Write-Error "ShredPack.exe was not created!"
            exit 1
          }

          if (!(Test-Path "Output\ShredPack-Setup.exe")) {
            Write-Error "ShredPack-Setup.exe was not created!"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShredPack-build
          path: |
            dist\ShredPack.exe
            Output\ShredPack-Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShredPack Latest
          make_latest: true
          files: |
            dist\ShredPack.exe
            Output\ShredPack-Setup.exe
