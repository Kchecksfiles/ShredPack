name: Build ShredPack EXE

on:
  push:
    branches:
      - main  # Automatically builds every time you push code changes to the main branch

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller tkinterdnd2 send2trash

    - name: Compile Script to Standalone EXE
      run: |
        pyinstaller --noconsole --onefile --icon=shredpack.ico --add-data "shredpack.ico;." --collect-all py7zr --collect-all pycdlib --collect-all pyzipper --collect-all tkinterdnd2 --name ShredPack shredpack.py
