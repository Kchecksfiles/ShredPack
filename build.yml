name: Build ShredPack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create a GitHub Release (the default token is read-only).
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only on purpose: the engine tests expect the optional
      # packages (py7zr, pycdlib, pyzipper) to be absent and check the messages.
      - name: Engine tests
        run: python tests/test_shredpack.py

      - name: UI logic smoke tests
        run: python tests/ui_smoke.py

      - name: Right-click menu registration and ZIP verification tests
        run: python tests/test_menu_and_zip.py

      # Drives the real app through a stand-in for Tk's event loop, including the
      # exact launches Explorer's right-click menu performs (Test archive, Add to ZIP).
      - name: UI event-loop tests
        run: python tests/test_ui_event_loop.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from shredpack.py
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path shredpack.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "ShredPack version: $v"

      # Only for tag builds: a tag like v1.1.0 must match APP_VERSION, so the
      # installer, the update check and the release all agree.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.ver.outputs.version }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match APP_VERSION ${{ steps.ver.outputs.version }} in shredpack.py"
            exit 1
          }

      - name: Install dependencies
        run: pip install py7zr pycdlib pyzipper tkinterdnd2 send2trash pyinstaller

      - name: Build ShredPack.exe
        run: pyinstaller --noconsole --onefile --icon=shredpack.ico --add-data "shredpack.ico;." --collect-all py7zr --collect-all pycdlib --collect-all pyzipper --collect-all tkinterdnd2 --name ShredPack shredpack.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} setup.iss'

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist\ShredPack.exe, Output\ShredPack-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShredPack-build
          path: |
            dist\ShredPack.exe
            Output\ShredPack-Setup.exe
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\ShredPack.exe
            Output\ShredPack-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
