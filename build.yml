name: Build ShredPack

# What each trigger does
#   * pull_request, push to main, or a manual run with "publish" UNTICKED
#         -> tests, build, generate + verify SHA256SUMS.txt, upload workflow artifacts.
#            NOTHING is published and no existing release is touched (safe test build).
#   * push of a tag vX.Y.Z
#         -> the same, then attach the three files to that tag's release (the release is created if
#            the tag has none). The tag must equal "v" + APP_VERSION, and the build is of the tag's commit.
#   * manual run on main with "publish" TICKED
#         -> the same, then attach the three files to the EXISTING, published release in "release_tag".
#
# Publishing never deletes a release or tag and never creates a tag. It refuses, with a clear message, to:
# replace files already on a release (unless "replace_existing_assets" is ticked on a manual run), attach a
# build to a release whose tag points at a different commit (unless "allow_commit_mismatch" is ticked), or
# publish a version that doesn't match APP_VERSION. Every release gets exactly three files:
# ShredPack.exe, ShredPack-Setup.exe and SHA256SUMS.txt - and they are verified again after upload.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to a GitHub Release. Leave UNTICKED for a safe test build (nothing is published or changed)."
        type: boolean
        default: false
      release_tag:
        description: "Only used when 'publish' is ticked: the EXISTING published release to attach the files to, e.g. v1.1.1 (must equal v + APP_VERSION)."
        type: string
        default: ""
      replace_existing_assets:
        description: "Only if that release already has ShredPack.exe / ShredPack-Setup.exe / SHA256SUMS.txt: tick to REPLACE them."
        type: boolean
        default: false
      allow_commit_mismatch:
        description: "Tick to attach a build of THIS commit to a release whose tag points at a different commit."
        type: boolean
        default: false

permissions:
  contents: read

# Runs for the same ref queue up instead of racing each other for one release's files.
concurrency:
  group: shredpack-${{ github.ref }}
  cancel-in-progress: false

env:
  # "true": publishing fails when VERSION.txt differs from APP_VERSION. "false": it only warns, because
  # VERSION.txt drives the in-app "update available" link and is often updated last, when you announce.
  STRICT_VERSION_TXT: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine tests
        run: python tests/test_shredpack.py

      - name: UI logic smoke tests
        run: python tests/ui_smoke.py

      - name: Right-click menu registration and ZIP verification tests
        run: python tests/test_menu_and_zip.py

      - name: UI event-loop tests
        run: python tests/test_ui_event_loop.py

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # only this job may attach files to a release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to compare a release tag's commit with this build and find the newest version

      - name: Read version from shredpack.py
        id: ver
        shell: pwsh
        run: |
          $match = Select-String -Path shredpack.py -Pattern '^APP_VERSION = "(.+)"'
          if (-not $match) {
            throw "Could not find APP_VERSION in shredpack.py"
          }
          $v = $match.Matches[0].Groups[1].Value
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "APP_VERSION '$v' is not of the form x.y.z"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "ShredPack version: $v"

      # Replaces "Check tag matches version": the same rule, now applied to tag pushes AND manual publishes,
      # plus the checks that protect existing releases. Decides whether this run publishes at all.
      - name: Decide release target
        id: target
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_REPLACE: ${{ inputs.replace_existing_assets }}
          INPUT_ALLOW_MISMATCH: ${{ inputs.allow_commit_mismatch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = "v$env:VERSION"
          $names = @('ShredPack.exe', 'ShredPack-Setup.exe', 'SHA256SUMS.txt')
          $tag = ''
          $mode = 'build-only'

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $mode = 'tag'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_PUBLISH -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              Write-Error "Publishing from a manual run is only allowed on the main branch (this run is on $env:GITHUB_REF)."
              exit 1
            }
            $tag = "$env:INPUT_TAG".Trim()
            if (-not $tag) {
              Write-Error "'publish' is ticked but 'release_tag' is empty. Enter the existing release to attach to, e.g. $expected."
              exit 1
            }
            $mode = 'manual'
          }

          $publish = 'false'
          $replace = 'false'
          $releaseExists = 'false'
          $makeLatest = 'false'

          if ($tag) {
            $publish = 'true'
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              Write-Error "Release tag '$tag' is not of the form vX.Y.Z. (A moving tag such as 'latest' is never used.)"
              exit 1
            }
            if ($tag -ne $expected) {
              Write-Error "Release tag '$tag' does not match APP_VERSION $env:VERSION (expected $expected). Refusing to publish a mismatched build."
              exit 1
            }

            # Does the release already exist, and which of our three files does it already have?
            $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
            $found = ($LASTEXITCODE -eq 0)
            if ($found) { $releaseExists = 'true' }
            if ($mode -eq 'manual' -and -not $found) {
              Write-Error "Published release $tag was not found. Create and PUBLISH it first (a draft release is not found either). A manual run never creates releases or tags."
              exit 1
            }
            $existing = @()
            if ($found) {
              $existing = @((($releaseJson -join "`n") | ConvertFrom-Json).assets | Where-Object { $names -contains $_.name } | ForEach-Object { $_.name })
            }
            if ($existing.Count -gt 0) {
              if ($mode -eq 'tag') {
                Write-Error "Release $tag already has $($existing -join ', '). A tag-triggered build never replaces existing files. To replace them deliberately, use Run workflow with 'publish' and 'replace_existing_assets' ticked."
                exit 1
              } elseif ($env:INPUT_REPLACE -eq 'true') {
                Write-Host "::warning::Release $tag already has $($existing -join ', '); this run will REPLACE them."
                $replace = 'true'
              } else {
                Write-Error "Release $tag already has $($existing -join ', '). Nothing was changed. Re-run and tick 'replace_existing_assets' only if you want those files replaced."
                exit 1
              }
            }

            # A manual run builds THIS commit; make sure that is the commit the release's tag points at.
            if ($mode -eq 'manual') {
              $tagCommit = git rev-parse "refs/tags/${tag}^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
                Write-Error "Tag $tag does not exist in the repository."
                exit 1
              }
              if ($tagCommit -ne $env:GITHUB_SHA) {
                $why = "Tag $tag points at commit $tagCommit but this build is of commit $($env:GITHUB_SHA). The release's 'Source code' downloads would show the tag's commit while the attached files come from this one."
                if ($env:INPUT_ALLOW_MISMATCH -eq 'true') {
                  Write-Host "::warning::$why (allowed because 'allow_commit_mismatch' is ticked)"
                } else {
                  Write-Error "$why To publish from a clean state, release a new version instead; or tick 'allow_commit_mismatch' if you accept this."
                  exit 1
                }
              }
            }

            # Only the newest vX.Y.Z may be marked "Latest"; older releases never are.
            $newest = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if ($tag -eq $newest) { $makeLatest = 'true' }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "replace=$replace" >> $env:GITHUB_OUTPUT
          "release_exists=$releaseExists" >> $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT
          if ($tag) {
            Write-Host "Will publish to release $tag (mode: $mode, replace existing files: $replace, make_latest: $makeLatest)"
          } else {
            Write-Host 'Safe test build: nothing will be published and no release will be touched.'
          }

      - name: Check version consistency
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUBLISH: ${{ steps.target.outputs.publish }}
        run: |
          $publishing = ($env:PUBLISH -eq 'true')
          if (-not (Test-Path -LiteralPath VERSION.txt)) {
            Write-Host '::warning::VERSION.txt is missing, so the in-app update check has nothing to read.'
          } else {
            $published = (Get-Content -LiteralPath VERSION.txt -Raw).Trim()
            if ($published -ne $env:VERSION) {
              $msg = "VERSION.txt says '$published' but APP_VERSION is '$env:VERSION'. The in-app update link follows VERSION.txt."
              if ($publishing -and $env:STRICT_VERSION_TXT -eq 'true') {
                Write-Error $msg
                exit 1
              }
              Write-Host "::warning::$msg"
            } else {
              Write-Host "VERSION.txt matches APP_VERSION ($published)."
            }
          }
          if (-not (Select-String -Path setup.iss -Pattern '^\s*AppVersion\s*=\s*\{#MyAppVersion\}' -Quiet)) {
            $msg = "setup.iss does not take AppVersion from MyAppVersion, so the installer may not carry version $env:VERSION."
            if ($publishing) {
              Write-Error $msg
              exit 1
            }
            Write-Host "::warning::$msg"
          } else {
            Write-Host "setup.iss takes its version from MyAppVersion (passed as $env:VERSION)."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install py7zr pycdlib pyzipper tkinterdnd2 send2trash pyinstaller

      - name: Build ShredPack.exe
        run: pyinstaller --noconsole --onefile --icon=shredpack.ico --add-data "shredpack.ico;." --collect-all py7zr --collect-all pycdlib --collect-all pyzipper --collect-all tkinterdnd2 --name ShredPack shredpack.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} setup.iss'

      # Format: <64 lowercase hex><two spaces><file name>, one line per file, LF line endings, no BOM
      # (so Windows tools and `sha256sum -c` both accept it). Hashes are taken from the exact files that are
      # uploaded and released below - the same paths in the same workspace, never copies.
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/ShredPack.exe",
            "Output/ShredPack-Setup.exe"
          )

          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing file: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "File is empty: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }

          $text = ($lines -join "`n") + "`n"
          $path = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content -LiteralPath $path

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($f in "dist/ShredPack.exe", "Output/ShredPack-Setup.exe", "SHA256SUMS.txt") {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) {
              throw "Missing build output: $f"
            }
            $length = (Get-Item -LiteralPath $f).Length
            if ($length -le 0) {
              throw "Build output is empty: $f"
            }
            Write-Host ("Verified: {0} ({1:N0} bytes)" -f $f, $length)
          }

      # Recalculates the hashes and compares them with SHA256SUMS.txt before anything is uploaded or published.
      - name: Verify SHA256SUMS.txt against the built files
        shell: pwsh
        run: |
          $raw = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath 'SHA256SUMS.txt').Path)
          if ($raw.Contains("`r")) { throw 'SHA256SUMS.txt must use LF line endings' }
          $lines = @($raw.TrimEnd("`n").Split("`n"))
          if ($lines.Count -ne 2) { throw "SHA256SUMS.txt must have exactly 2 entries, found $($lines.Count)" }
          $paths = @{
            'ShredPack.exe'       = 'dist/ShredPack.exe'
            'ShredPack-Setup.exe' = 'Output/ShredPack-Setup.exe'
          }
          $seen = @{}
          foreach ($line in $lines) {
            if (-not ($line -cmatch '^([0-9a-f]{64})  (ShredPack\.exe|ShredPack-Setup\.exe)$')) {
              throw "Malformed SHA256SUMS.txt line: $line"
            }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($seen.ContainsKey($name)) { throw "Duplicate SHA256SUMS.txt entry for $name" }
            $seen[$name] = $true
            $actual = (Get-FileHash -LiteralPath $paths[$name] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) {
              throw "Checksum mismatch for $name (file: $actual, SHA256SUMS.txt: $hash)"
            }
            Write-Host "OK  $name  $hash"
          }
          if ($seen.Count -ne 2) { throw 'SHA256SUMS.txt does not list both files' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShredPack-build
          path: |
            dist/ShredPack.exe
            Output/ShredPack-Setup.exe
            SHA256SUMS.txt
          if-no-files-found: error

      # Runs only for a version-tag push or a deliberate manual publish (see "Decide release target").
      # The release's title and notes are left alone when it already exists; a brand-new release gets
      # the usual name and generated notes. Existing files are replaced only when the target step said so.
      - name: Publish release assets
        if: steps.target.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.release_exists == 'false' && format('ShredPack {0}', steps.target.outputs.tag) || '' }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          overwrite_files: ${{ steps.target.outputs.replace == 'true' }}
          files: |
            dist/ShredPack.exe
            Output/ShredPack-Setup.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.target.outputs.release_exists == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Downloads the three published assets back and re-verifies them, so what is checked is what users
      # will actually get: each is byte-identical to the file built here, and the published
      # SHA256SUMS.txt is valid for the published executables.
      - name: Verify published assets
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          $built = [ordered]@{
            'ShredPack.exe'       = 'dist/ShredPack.exe'
            'ShredPack-Setup.exe' = 'Output/ShredPack-Setup.exe'
            'SHA256SUMS.txt'      = 'SHA256SUMS.txt'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'release-check'
          $missing = @()
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
            New-Item -ItemType Directory -Path $dir | Out-Null
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir --clobber --pattern 'ShredPack.exe' --pattern 'ShredPack-Setup.exe' --pattern 'SHA256SUMS.txt'
            $missing = @($built.Keys | Where-Object { -not (Test-Path -LiteralPath (Join-Path $dir $_) -PathType Leaf) })
            if ($missing.Count -eq 0) { break }
            Write-Host "Attempt ${attempt}: not all assets are downloadable yet (missing: $($missing -join ', ')); retrying..."
            Start-Sleep -Seconds 5
          }
          if ($missing.Count -gt 0) {
            throw "Release $($env:TAG) is missing required asset(s): $($missing -join ', ')"
          }

          foreach ($name in $built.Keys) {
            $local = (Get-FileHash -LiteralPath $built[$name] -Algorithm SHA256).Hash.ToLowerInvariant()
            $published = (Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($local -ne $published) {
              throw "$name on the release differs from the file that was built (built: $local, published: $published)"
            }
            Write-Host "Published $name is identical to the built file ($published)"
          }

          $raw = [System.IO.File]::ReadAllText((Join-Path $dir 'SHA256SUMS.txt'))
          $lines = @($raw.TrimEnd("`n").Split("`n"))
          if ($raw.Contains("`r") -or $lines.Count -ne 2) {
            throw 'The published SHA256SUMS.txt is not the expected 2-line LF file'
          }
          foreach ($line in $lines) {
            if (-not ($line -cmatch '^([0-9a-f]{64})  (ShredPack\.exe|ShredPack-Setup\.exe)$')) {
              throw "Malformed line in the published SHA256SUMS.txt: $line"
            }
            $hash = $Matches[1]
            $name = $Matches[2]
            $actual = (Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) {
              throw "The published SHA256SUMS.txt does not match the published $name"
            }
            Write-Host "OK (published)  $name  $hash"
          }
          Write-Host "Release $($env:TAG) has ShredPack.exe, ShredPack-Setup.exe and SHA256SUMS.txt, and they verify."
