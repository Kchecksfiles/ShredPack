
name: Build ShredPack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine tests
        run: python tests/test_shredpack.py

      - name: UI logic smoke tests
        run: python tests/ui_smoke.py

      - name: Right-click menu registration and ZIP verification tests
        run: python tests/test_menu_and_zip.py

      - name: UI event-loop tests
        run: python tests/test_ui_event_loop.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Read version from shredpack.py
        id: ver
        shell: pwsh
        run: |
          $match = Select-String -Path shredpack.py -Pattern '^APP_VERSION = "(.+)"'
          if (-not $match) {
            throw "Could not find APP_VERSION in shredpack.py"
          }
          $v = $match.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "ShredPack version: $v"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.ver.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} doesn't match APP_VERSION ${{ steps.ver.outputs.version }}"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install py7zr pycdlib pyzipper tkinterdnd2 send2trash pyinstaller

      - name: Build ShredPack.exe
        run: pyinstaller --noconsole --onefile --icon=shredpack.ico --add-data "shredpack.ico;." --collect-all py7zr --collect-all pycdlib --collect-all pyzipper --collect-all tkinterdnd2 --name ShredPack shredpack.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} setup.iss'

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/ShredPack.exe",
            "Output/ShredPack-Setup.exe"
          )

          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing file: $file"
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }

          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($f in "dist/ShredPack.exe", "Output/ShredPack-Setup.exe", "SHA256SUMS.txt") {
            if (-not (Test-Path $f)) {
              throw "Missing build output: $f"
            }
            Write-Host "Verified: $f"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShredPack-build
          path: |
            dist/ShredPack.exe
            Output/ShredPack-Setup.exe
            SHA256SUMS.txt
          if-no-files-found: error

      # Manual run on main uploads to the existing v1.1.1 release.
      # A version-tag push uploads to its matching release.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v1.1.1' || github.ref_name }}
          name: ShredPack ${{ github.event_name == 'workflow_dispatch' && 'v1.1.1' || github.ref_name }}
          make_latest: false
          files: |
            dist/ShredPack.exe
            Output/ShredPack-Setup.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
